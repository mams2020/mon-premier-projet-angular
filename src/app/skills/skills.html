<section class="skills">
  <h2>Mes Compétences</h2>

  <div class="skills-grid">
    @for (skill of skills; track skill.nom) {
      <div class="skill-card">
        <span class="skill-nom">{{ skill.nom }}</span>
        <span class="skill-categorie">{{ skill.categorie }}</span>
      </div>
    }
  </div>
</section>
